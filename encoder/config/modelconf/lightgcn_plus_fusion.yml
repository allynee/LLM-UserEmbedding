optimizer:
  name: adam
  lr: 1.0e-3
  weight_decay: 0

train:
  epoch: 3000
  batch_size: 4096
  save_model: true
  loss: pairwise
  test_step: 3
  reproducible: true
  seed: 2023
  patience: 5

test:
  metrics: [recall, ndcg]
  k: [5, 10, 20]
  batch_size: 1024

data:
  type: general_cf
  name: amazon

model:
  name: lightgcn_plus_fusion 
  # general parameters here

  keep_rate: 0.8
  embedding_size: 32

  # dataset-specific parameters here
  layer_num: 3
  reg_weight: 1.0e-7
  kd_weight: 1.0e-2
  kd_temperature: 0.2

  # for amazon
  amazon:
    layer_num: 4
    reg_weight: 1.0e-8
    kd_weight: 5.0e-3
    kd_temperature: 0.2
    fusion_type: weighted_sum
    alpha_mode: interaction   # use per-user α(u) from interaction counts
    # alpha_mode: global
    # alpha: 0.75
    norm_before_fusion: false  # enable normalization fusion
  # for yelp
  yelp:
    layer_num: 3
    reg_weight: 1.0e-7
    kd_weight: 1.0e-2
    kd_temperature: 0.2
    fusion_type: weighted_sum
    alpha_mode: interaction 
    norm_before_fusion: false 
  # for steam:
  steam:
    layer_num: 3
    reg_weight: 1.0e-8
    kd_weight: 1.0e-3
    kd_temperature: 0.1
    fusion_type: weighted_sum
    alpha_mode: interaction
    norm_before_fusion: false 
